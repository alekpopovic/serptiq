# Rails Omakase is the documented project baseline. Only generated and vendored
# trees are excluded; migrations and application code remain in scope.
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  Exclude:
    - "app/assets/builds/**/*"
    - "db/*_schema.rb"
    - "public/assets/**/*"
    - "tmp/**/*"
    - "vendor/**/*"

version: 1
policy_version: iana-special-purpose-2025-10-09
protected_worker_roles:
  - worker_crawl
  - worker_render
runtime_attestation: SEARCHOPS_CRAWLER_EGRESS_ENFORCED
default_action: deny
dns:
  resolver_allowlist_required: true
  destination_port: 53
  transports: [tcp, udp]
http:
  destination_ports: [80, 443]
ipv4_denied_cidrs:
  - 0.0.0.0/8
  - 10.0.0.0/8
  - 100.64.0.0/10
  - 127.0.0.0/8
  - 169.254.0.0/16
  - 172.16.0.0/12
  - 192.0.0.0/24
  - 192.0.2.0/24
  - 192.88.99.0/24
  - 192.168.0.0/16
  - 198.18.0.0/15
  - 198.51.100.0/24
  - 203.0.113.0/24
  - 224.0.0.0/4
  - 240.0.0.0/4
ipv6_allowed_unicast_cidr: "2000::/3"
ipv6_denied_cidrs:
  - "::/96"
  - "64:ff9b::/96"
  - "64:ff9b:1::/48"
  - "100::/64"
  - "100:0:0:1::/64"
  - "2001::/23"
  - "2001:db8::/32"
  - "2002::/16"
  - "3fff::/20"
  - "5f00::/16"

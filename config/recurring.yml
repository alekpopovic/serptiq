default: &default
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    queue: maintenance
    priority: 50
    schedule: every hour at minute 12
  clear_solid_queue_finished_batches:
    command: "SolidQueue::Batch.clear_finished_in_batches(sleep_between_batches: 0.3)"
    queue: maintenance
    priority: 50
    schedule: every hour at minute 27
  cleanup_inactive_identity_sessions:
    command: "Identity::SessionCleanupJob.perform_later"
    queue: maintenance
    priority: 50
    schedule: every day at 03:17
  cleanup_expired_authentication_rate_limits:
    command: "Identity::AuthenticationRateLimitCleanupJob.perform_later"
    queue: maintenance
    priority: 50
    schedule: every hour at minute 42
  maintain_organization_invitations:
    command: "Tenancy::InvitationMaintenanceJob.perform_later"
    queue: maintenance
    priority: 50
    schedule: every hour at minute 52
  maintain_usage_quota_reservations:
    command: "Usage::QuotaReservationMaintenanceJob.perform_later"
    queue: maintenance
    priority: 50
    schedule: every hour at minute 57
  reconcile_billing_subscriptions:
    command: "Billing::ReconciliationSweepJob.perform_later"
    queue: billing
    priority: 40
    schedule: every 6 hours at minute 7
  recheck_dns_verifications:
    command: "Verification::DnsRecheckSweepJob.perform_later"
    queue: maintenance
    priority: 50
    schedule: every hour at minute 17

development:
  <<: *default

test:
  <<: *default

staging:
  <<: *default

production:
  <<: *default

version: 1

controllers:
  Auditing::AuditEventsController:
    source: app/controllers/auditing/audit_events_controller.rb
    actions:
      index: { kind: permission, permission: audit_log.read }
      export: { kind: permission, permission: audit_log.export }
  DashboardController:
    source: app/controllers/dashboard_controller.rb
    actions:
      index:
        kind: permission
        permission: organization.read
        condition: organization_route
  Plans::CatalogController:
    source: app/controllers/plans/catalog_controller.rb
    actions:
      index: &platform_plan_catalog
        kind: exempt
        reason: platform_plan_catalog_permission
      publish: *platform_plan_catalog
      retire: *platform_plan_catalog
  Plans::ComparisonsController:
    source: app/controllers/plans/comparisons_controller.rb
    actions:
      show: { kind: permission, permission: plans.read }
  Billing::CheckoutsController:
    source: app/controllers/billing/checkouts_controller.rb
    actions:
      create: { kind: permission, permission: billing.manage }
  Billing::CheckoutReturnsController:
    source: app/controllers/billing/checkout_returns_controller.rb
    actions:
      show: { kind: permission, permission: plans.read }
  Billing::PortalsController:
    source: app/controllers/billing/portals_controller.rb
    actions:
      create: { kind: permission, permission: billing.manage }
  Billing::PlanChangesController:
    source: app/controllers/billing/plan_changes_controller.rb
    actions:
      create: { kind: permission, permission: billing.manage }
  Billing::SupportController:
    source: app/controllers/billing/support_controller.rb
    actions:
      index: &platform_billing_support
        kind: exempt
        reason: platform_billing_support_permission
      replay: *platform_billing_support
      reconcile: *platform_billing_support
  Usage::DashboardsController:
    source: app/controllers/usage/dashboards_controller.rb
    actions:
      show: { kind: permission, permission: billing.read }
  Entitlements::DiagnosticsController:
    source: app/controllers/entitlements/diagnostics_controller.rb
    actions:
      show: { kind: permission, permission: plans.read }
  Projects::ProjectsController:
    source: app/controllers/projects/projects_controller.rb
    actions:
      index: { kind: filtered, reason: scope_filtered_project_directory, permission: projects.read, scope: project_collection }
      new: &create_projects { kind: permission, permission: projects.create, scope: organization }
      create: *create_projects
      show: { kind: permission, permission: projects.read, scope: project }
      edit: &update_projects { kind: permission, permission: projects.update, scope: project }
      update: *update_projects
      archive: &archive_projects { kind: permission, permission: projects.archive, scope: project }
      reactivate: *archive_projects
      deletion: &delete_projects { kind: permission, permission: projects.delete, scope: project }
      destroy: *delete_projects
      cancel_deletion: *delete_projects
  Onboarding::ProjectSetupsController:
    source: app/controllers/onboarding/project_setups_controller.rb
    actions:
      index: &guided_project_setup { kind: permission, permission: projects.create, scope: organization }
      create: *guided_project_setup
      show: *guided_project_setup
      update: *guided_project_setup
      complete: *guided_project_setup
      destroy: *guided_project_setup
  Properties::PropertiesController:
    source: app/controllers/properties/properties_controller.rb
    actions:
      index: { kind: filtered, reason: scope_filtered_property_directory, permission: properties.read, scope: property_collection }
      new: &create_properties { kind: permission, permission: properties.manage, scope: project }
      create: *create_properties
      show: { kind: permission, permission: properties.read, scope: property }
      edit: &manage_properties { kind: permission, permission: properties.manage, scope: property }
      update: *manage_properties
      archive: *manage_properties
      reactivate: *manage_properties
      deletion: &delete_properties { kind: permission, permission: projects.delete, scope: property }
      destroy: *delete_properties
      cancel_deletion: *delete_properties
  Properties::EnvironmentsController:
    source: app/controllers/properties/environments_controller.rb
    actions:
      index: &read_property_environments { kind: permission, permission: properties.read, scope: property }
      show: *read_property_environments
      new: &manage_property_environments { kind: permission, permission: properties.manage, scope: property }
      create: *manage_property_environments
      edit: *manage_property_environments
      update: *manage_property_environments
      archive: *manage_property_environments
      reactivate: *manage_property_environments
  Verification::ChallengesController:
    source: app/controllers/verification/challenges_controller.rb
    actions:
      show: &verify_property_environment { kind: permission, permission: properties.verify, scope: property }
      create: *verify_property_environment
      attempt: *verify_property_environment
      revoke: *verify_property_environment
  Crawling::PoliciesController:
    source: app/controllers/crawling/policies_controller.rb
    actions:
      edit: &configure_crawl_policy { kind: permission, permission: scans.configure, scope: property }
      update: *configure_crawl_policy
      reset: *configure_crawl_policy
  Crawling::ScansController:
    source: app/controllers/crawling/scans_controller.rb
    actions:
      index: &read_project_scans { kind: permission, permission: scans.read, scope: project }
      show: *read_project_scans
      create: { kind: permission, permission: scans.run, scope: project }
      cancel: { kind: permission, permission: scans.cancel, scope: project }
  Tenancy::InvitationAcceptancesController:
    source: app/controllers/tenancy/invitation_acceptances_controller.rb
    actions:
      show: &verified_invitation
        kind: exempt
        reason: verified_token_bound_acceptance
      create: *verified_invitation
  Tenancy::InvitationEntriesController:
    source: app/controllers/tenancy/invitation_entries_controller.rb
    actions:
      show:
        kind: exempt
        reason: public_opaque_token_entry
  Tenancy::InvitationsController:
    source: app/controllers/tenancy/invitations_controller.rb
    actions:
      index: { kind: permission, permission: members.read }
      new: &invite_members { kind: permission, permission: members.invite }
      create: *invite_members
      revoke: *invite_members
      resend: *invite_members
  Tenancy::MembersController:
    source: app/controllers/tenancy/members_controller.rb
    actions:
      index: &read_members { kind: permission, permission: members.read }
      show: *read_members
      suspend: &update_members { kind: permission, permission: members.update }
      reactivate: *update_members
      remove: { kind: permission, permission: members.remove }
  Tenancy::OrganizationSettingsController:
    source: app/controllers/tenancy/organization_settings_controller.rb
    actions:
      show: { kind: permission, permission: organization.read }
      update: { kind: permission, permission: organization.update }
  Tenancy::OwnershipTransfersController:
    source: app/controllers/tenancy/ownership_transfers_controller.rb
    actions:
      show: &transfer_ownership { kind: permission, permission: organization.transfer }
      create: *transfer_ownership
  Tenancy::OrganizationSwitchesController:
    source: app/controllers/tenancy/organization_switches_controller.rb
    actions:
      show: { kind: permission, permission: organization.read }
  Tenancy::OrganizationsController:
    source: app/controllers/tenancy/organizations_controller.rb
    actions:
      new: &first_tenant
        kind: exempt
        reason: creates_first_tenant_context
      create: *first_tenant
  Tenancy::TeamsController:
    source: app/controllers/tenancy/teams_controller.rb
    actions:
      index: &read_teams { kind: permission, permission: teams.read }
      show: *read_teams
      new: &manage_teams { kind: permission, permission: teams.manage }

version: 1

controllers:
  Auditing::AuditEventsController:
    source: app/controllers/auditing/audit_events_controller.rb
    actions:
      index: { kind: permission, permission: audit_log.read }
      export: { kind: permission, permission: audit_log.export }
  DashboardController:
    source: app/controllers/dashboard_controller.rb
    actions:
      index:
        kind: permission
        permission: organization.read
        condition: organization_route
  Plans::CatalogController:
    source: app/controllers/plans/catalog_controller.rb
    actions:
      index: &platform_plan_catalog
        kind: exempt
        reason: platform_plan_catalog_permission
      publish: *platform_plan_catalog
      retire: *platform_plan_catalog
  Plans::ComparisonsController:
    source: app/controllers/plans/comparisons_controller.rb
    actions:
      show: { kind: permission, permission: plans.read }
  Usage::DashboardsController:
    source: app/controllers/usage/dashboards_controller.rb
    actions:
      show: { kind: permission, permission: billing.read }
  Entitlements::DiagnosticsController:
    source: app/controllers/entitlements/diagnostics_controller.rb
    actions:
      show: { kind: permission, permission: plans.read }
  Tenancy::InvitationAcceptancesController:
    source: app/controllers/tenancy/invitation_acceptances_controller.rb
    actions:
      show: &verified_invitation
        kind: exempt
        reason: verified_token_bound_acceptance
      create: *verified_invitation
  Tenancy::InvitationEntriesController:
    source: app/controllers/tenancy/invitation_entries_controller.rb
    actions:
      show:
        kind: exempt
        reason: public_opaque_token_entry
  Tenancy::InvitationsController:
    source: app/controllers/tenancy/invitations_controller.rb
    actions:
      index: { kind: permission, permission: members.read }
      new: &invite_members { kind: permission, permission: members.invite }
      create: *invite_members
      revoke: *invite_members
      resend: *invite_members
  Tenancy::MembersController:
    source: app/controllers/tenancy/members_controller.rb
    actions:
      index: &read_members { kind: permission, permission: members.read }
      show: *read_members
      suspend: &update_members { kind: permission, permission: members.update }
      reactivate: *update_members
      remove: { kind: permission, permission: members.remove }
  Tenancy::OrganizationSettingsController:
    source: app/controllers/tenancy/organization_settings_controller.rb
    actions:
      show: { kind: permission, permission: organization.read }
      update: { kind: permission, permission: organization.update }
  Tenancy::OwnershipTransfersController:
    source: app/controllers/tenancy/ownership_transfers_controller.rb
    actions:
      show: &transfer_ownership { kind: permission, permission: organization.transfer }
      create: *transfer_ownership
  Tenancy::OrganizationSwitchesController:
    source: app/controllers/tenancy/organization_switches_controller.rb
    actions:
      show: { kind: permission, permission: organization.read }
  Tenancy::OrganizationsController:
    source: app/controllers/tenancy/organizations_controller.rb
    actions:
      new: &first_tenant
        kind: exempt
        reason: creates_first_tenant_context
      create: *first_tenant
  Tenancy::TeamsController:
    source: app/controllers/tenancy/teams_controller.rb
    actions:
      index: &read_teams { kind: permission, permission: teams.read }
      show: *read_teams
      new: &manage_teams { kind: permission, permission: teams.manage }
      create: *manage_teams
      update: *manage_teams
      archive: *manage_teams
      add_member: *manage_teams
      remove_member: *manage_teams

jobs:
  Identity::AuthenticationRateLimitCleanupJob:
    kind: system
    name: authentication_rate_limit_cleanup
  Identity::SessionCleanupJob:
    kind: system
    name: session_cleanup
  Shared::SolidQueueSmokeJob:
    kind: system
    name: solid_queue_smoke
  Tenancy::InvitationMaintenanceJob:
    kind: system
    name: global_invitation_maintenance
  Usage::QuotaReservationMaintenanceJob:
    kind: system
    name: quota_reservation_maintenance

domain_operations:
  Auditing::Public.audit_page: { kind: permission, permission: audit_log.read }
  Auditing::Public.export!: { kind: permission, permission: audit_log.export }
  Auditing::Public.consistency_issues: { kind: system, reason: operator_diagnostic }
  Auditing::Public.record!: { kind: context, reason: append_only_internal_audit_sink }
  Tenancy::Public.create_organization: { kind: exempt, reason: creates_first_tenant_context }
  Tenancy::Public.resolve_organization_context: { kind: context, reason: validates_active_membership }
  Tenancy::Public.organization_switcher: { kind: context, reason: returns_only_active_memberships }
  Tenancy::Public.organization_navigation: { kind: context, reason: returns_only_active_memberships }
  Tenancy::Public.membership_page: { kind: permission, permission: members.read }
  Tenancy::Public.membership_detail: { kind: permission, permission: members.read }
  Tenancy::Public.create_membership: { kind: permission, permission: members.invite }
  Tenancy::Public.change_membership_status: { kind: permission, permission: members.update }
  Tenancy::Public.issue_invitation: { kind: permission, permission: members.invite }
  Tenancy::Public.revoke_invitation: { kind: permission, permission: members.invite }
  Tenancy::Public.resend_invitation: { kind: permission, permission: members.invite }
  Tenancy::Public.review_invitation: { kind: exempt, reason: verified_token_bound_acceptance }
  Tenancy::Public.accept_invitation: { kind: exempt, reason: verified_token_bound_acceptance }
  Tenancy::Public.create_team: { kind: permission, permission: teams.manage }
  Tenancy::Public.rename_team: { kind: permission, permission: teams.manage }
  Tenancy::Public.archive_team: { kind: permission, permission: teams.manage }
  Tenancy::Public.add_team_member: { kind: permission, permission: teams.manage }
  Tenancy::Public.remove_team_member: { kind: permission, permission: teams.manage }
  Tenancy::Public.team_page: { kind: permission, permission: teams.read }
  Tenancy::Public.team_details: { kind: permission, permission: teams.read }
  Tenancy::Public.update_organization: { kind: permission, permission: organization.update }
  Tenancy::Public.transition_organization: { kind: permission, permission: organization.delete }
  Tenancy::Public.ownership_transfer_candidates: { kind: permission, permission: organization.transfer }
  Tenancy::Public.transfer_ownership: { kind: permission, permission: organization.transfer }
  Tenancy::Public.verify_owner_invariant!: { kind: context, reason: enforces_current_owner_relationship }
  Tenancy::Public.ownership_consistency_issues: { kind: system, reason: operator_diagnostic }
  Authorization::Public.assign_role: { kind: permission, permission: roles.assign }
  Authorization::Public.revoke_role: { kind: permission, permission: roles.assign }
  Authorization::Public.access_decision: { kind: context, reason: unified_permission_entitlement_resource_quota_decision }
  Authorization::Public.authorize_access!: { kind: context, reason: enforced_unified_access_decision }
  Authorization::Public.with_access: { kind: context, reason: enforced_access_with_pre_enqueue_release }
  Authorization::Public.authorize_job_access!: { kind: context, reason: reauthorized_user_tenant_job_access }
  Billing::Public.create_subscription_reference:
    kind: context
    reason: explicit_tenant_and_published_plan_projection
  Billing::Public.active_subscriber_counts: { kind: context, reason: platform_catalog_review_projection }
  Billing::Public.active_subscriber_count: { kind: context, reason: locked_catalog_retirement_projection }
  Billing::Public.plan_provider_mappings: { kind: system, reason: provider_mapping_consistency_projection }
  Billing::Public.active_subscription: { kind: context, reason: explicit_tenant_subscription_projection }
  Billing::Public.checkout_available?: { kind: context, reason: safe_provider_mapping_availability_projection }
  Entitlements::Public.validate_catalog: { kind: system, reason: governed_entitlement_definition_validation }
  Entitlements::Public.sync_catalog: { kind: system, reason: operator_entitlement_catalog_synchronization }
  Entitlements::Public.catalog_entries: { kind: context, reason: public_commercial_catalog_projection }
  Entitlements::Public.bind_subscription: { kind: context, reason: billing_owned_subscription_projection }
  Entitlements::Public.resolve: { kind: context, reason: explicit_tenant_entitlement_resolution }
  Entitlements::Public.set_organization_override: { kind: context, reason: platform_catalog_authorized_override }
  Entitlements::Public.revoke_organization_override: { kind: context, reason: platform_catalog_authorized_override }
  Entitlements::Public.diagnostic_report: { kind: permission, permission: plans.read }
  Administration::Public.plan_catalog_review: { kind: context, reason: called_after_platform_catalog_authorization }
  Administration::Public.retire_plan_version: { kind: context, reason: requires_platform_catalog_decision }
  Administration::Public.plan_catalog_consistency: { kind: system, reason: operator_catalog_diagnostic }
  Plans::Public.validate_catalog: { kind: system, reason: governed_catalog_validation }
  Plans::Public.sync_catalog: { kind: system, reason: operator_catalog_synchronization }
  Plans::Public.compare_catalog: { kind: system, reason: governed_catalog_diff }
  Plans::Public.authorize_catalog!: { kind: context, reason: platform_catalog_grant_validation }
  Plans::Public.catalog_decision: { kind: context, reason: platform_catalog_grant_hint }
  Plans::Public.catalog_entries: { kind: context, reason: called_after_platform_catalog_authorization }
  Plans::Public.current_offers: { kind: context, reason: published_commercial_catalog_projection }
  Plans::Public.version_snapshot: { kind: context, reason: internal_immutable_catalog_projection }
  Plans::Public.catalog_version: { kind: context, reason: locked_catalog_orchestration_projection }
  Plans::Public.purchasable_version: { kind: context, reason: current_catalog_selection }
  Plans::Public.plan_change_target: { kind: context, reason: current_catalog_target_selection }
  Plans::Public.register_snapshot_reference: { kind: context, reason: immutable_invoice_or_report_snapshot_link }
  Plans::Public.publish_version: { kind: context, reason: requires_platform_catalog_decision }
  Plans::Public.retire_version: { kind: context, reason: requires_platform_catalog_decision }
  Usage::Public.validate_catalog: { kind: system, reason: governed_usage_catalog_validation }
  Usage::Public.sync_catalog: { kind: system, reason: operator_usage_catalog_synchronization }
  Usage::Public.resolve_window: { kind: context, reason: explicit_tenant_meter_period_resolution }
  Usage::Public.record: { kind: context, reason: append_only_usage_observation }
  Usage::Public.correct: { kind: context, reason: append_only_same_tenant_compensation }
  Usage::Public.record_manual_adjustment: { kind: context, reason: platform_authorized_usage_adjustment }
  Usage::Public.summary: { kind: context, reason: explicit_tenant_usage_projection }
  Usage::Public.reserve: { kind: context, reason: atomic_tenant_quota_admission }
  Usage::Public.extend_reservation: { kind: context, reason: tenant_bound_quota_hold_extension }
  Usage::Public.finalize_reservation: { kind: context, reason: tenant_bound_usage_finalization }
  Usage::Public.release_reservation: { kind: context, reason: tenant_bound_quota_hold_release }
  Usage::Public.maintain_reservations: { kind: system, reason: bounded_quota_recovery_and_reconciliation }
  Usage::Public.organization_dashboard: { kind: permission, permission: billing.read }

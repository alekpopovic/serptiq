shared:
  application_name: SearchOps
  database_role: web
  database_port: 5432
  database_username: searchops
  primary_database_pool: 5
  queue_database_pool: 5
  cache_database_pool: 2
  cable_database_pool: 2
  database_process_count: 1
  database_reserved_connections: 5
  database_connect_timeout_seconds: 3
  database_checkout_timeout_seconds: 3
  database_statement_timeout_ms: 15000
  database_lock_timeout_ms: 5000
  database_idle_transaction_timeout_ms: 30000
  database_health_timeout_ms: 1000
  database_advisory_locks: true
  object_storage_service: local
  oauth_google_enabled: false
  oauth_github_enabled: false
  oauth_http_open_timeout: 2s
  oauth_http_read_timeout: 5s
  oauth_http_max_response_bytes: 262144
  oauth_http_safe_retries: 2
  oauth_jwks_cache_ttl: 5m
  oauth_jwks_max_keys: 16
  oauth_oidc_clock_skew: 60s
  oauth_oidc_max_token_lifetime: 2h
  oauth_transaction_ttl: 10m
  oauth_transaction_retention: 24h
  oauth_start_rate_window: 5m
  oauth_start_max_per_ip: 20
  oauth_start_max_per_session: 10
  oauth_start_max_open_per_ip: 5
  oauth_start_max_open_per_session: 2
  auth_callback_failure_rate_window: 5m
  auth_callback_failure_max_per_ip: 10
  auth_session_action_rate_window: 5m
  auth_session_action_max_per_session: 30
  auth_account_security_rate_window: 5m
  auth_account_security_max_per_session: 20
  billing_provider: disabled
  billing_http_open_timeout: 2s
  billing_http_read_timeout: 5s
  billing_http_write_timeout: 5s
  billing_http_max_response_bytes: 524288
  encryption_key_version: v1
  crawler_max_urls_per_scan: 10000
  crawler_connect_timeout: 5s
  crawler_read_timeout: 20s
  crawler_max_response_bytes: 10485760
  crawler_max_redirects: 5
  crawler_concurrency: 8
  browser_timeout: 45s
  browser_memory_mb: 1024
  browser_max_requests: 200
  browser_concurrency: 2
  dns_verification_enabled: true
  dns_verification_timeout: 3s
  dns_verification_max_records: 32
  dns_verification_max_response_bytes: 4096
  dns_verification_max_cname_hops: 5
  dns_verification_max_delegations: 8
  http_verification_enabled: true
  verification_http_dns_timeout: 3s
  verification_http_open_timeout: 2s
  verification_http_read_timeout: 5s
  verification_http_max_response_bytes: 262144
  verification_http_max_redirects: 2
  search_console_enabled: false
  pagespeed_enabled: false
  crux_enabled: false
  email_delivery_method: log
  slack_enabled: false
  log_level: info
  tracing_enabled: false
  process_role: web

development:
  application_origin: http://localhost:3000
  object_storage_service: local
  email_from: development@localhost
  database_connection_budget: 25

test:
  application_origin: https://searchops.test
  database_role: test
  object_storage_service: local
  crawler_max_urls_per_scan: 25
  crawler_concurrency: 1
  browser_concurrency: 1
  dns_verification_enabled: false
  http_verification_enabled: false
  email_delivery_method: test
  email_from: test@searchops.test
  database_connection_budget: 25

staging:
  object_storage_service: s3

production:
  object_storage_service: s3

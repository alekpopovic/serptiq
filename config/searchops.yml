shared:
  application_name: SearchOps
  database_role: web
  database_port: 5432
  database_username: searchops
  primary_database_pool: 5
  queue_database_pool: 5
  cache_database_pool: 2
  cable_database_pool: 2
  database_process_count: 1
  database_reserved_connections: 5
  database_connect_timeout_seconds: 3
  database_checkout_timeout_seconds: 3
  database_statement_timeout_ms: 15000
  database_lock_timeout_ms: 5000
  database_idle_transaction_timeout_ms: 30000
  database_health_timeout_ms: 1000
  database_advisory_locks: true
  object_storage_service: local
  oauth_google_enabled: false
  oauth_github_enabled: false
  billing_provider: disabled
  encryption_key_version: v1
  crawler_max_urls_per_scan: 10000
  crawler_connect_timeout: 5s
  crawler_read_timeout: 20s
  crawler_max_response_bytes: 10485760
  crawler_max_redirects: 5
  crawler_concurrency: 8
  browser_timeout: 45s
  browser_memory_mb: 1024
  browser_max_requests: 200
  browser_concurrency: 2
  search_console_enabled: false
  pagespeed_enabled: false
  crux_enabled: false
  email_delivery_method: log
  slack_enabled: false
  log_level: info
  tracing_enabled: false
  process_role: web

development:
  application_origin: http://localhost:3000
  object_storage_service: local
  email_from: development@localhost
  database_connection_budget: 25

test:
  application_origin: https://searchops.test
  database_role: test
  object_storage_service: local
  crawler_max_urls_per_scan: 25
  crawler_concurrency: 1
  browser_concurrency: 1
  email_delivery_method: test
  email_from: test@searchops.test
  database_connection_budget: 25

staging:
  object_storage_service: s3

production:
  object_storage_service: s3

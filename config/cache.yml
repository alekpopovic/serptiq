default: &default
  database: cache
  store_options:
    max_age: <%= 7.days.to_i %>
    max_size: <%= 256.megabytes %>
    expiry_batch_size: 500
    expiry_method: <%= :job.inspect %>
    expiry_queue: <%= :maintenance.inspect %>
    max_key_bytesize: 1024
    namespace: searchops-<%= Rails.env %>
  size_estimate_samples: 1000

development:
  <<: *default

test:
  <<: *default

staging:
  <<: *default

production:
  <<: *default

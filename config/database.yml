# PostgreSQL is the only application persistence technology. Development and
# test use four logical databases on one local server; staging/production may
# point each workload at a separate managed URL.
default: &default
  adapter: postgresql
  encoding: unicode
  connect_timeout: <%= Integer(ENV.fetch("SEARCHOPS_DATABASE_CONNECT_TIMEOUT_SECONDS", 3)) %>
  checkout_timeout: <%= Integer(ENV.fetch("SEARCHOPS_DATABASE_CHECKOUT_TIMEOUT_SECONDS", 3)) %>
  advisory_locks: <%= ENV.fetch("SEARCHOPS_DATABASE_ADVISORY_LOCKS", "true") %>
  variables:
    statement_timeout: <%= Integer(ENV.fetch("SEARCHOPS_DATABASE_STATEMENT_TIMEOUT_MS", 15000)) %>
    lock_timeout: <%= Integer(ENV.fetch("SEARCHOPS_DATABASE_LOCK_TIMEOUT_MS", 5000)) %>
    idle_in_transaction_session_timeout: <%= Integer(ENV.fetch("SEARCHOPS_DATABASE_IDLE_TRANSACTION_TIMEOUT_MS", 30000)) %>

development:
  primary:
    <<: *default
    schema_format: sql
    database: searchops_development
    max_connections: <%= Integer(ENV.fetch("SEARCHOPS_PRIMARY_DATABASE_POOL", ENV.fetch("RAILS_MAX_THREADS", 5))) %>
    application_name: searchops-development-<%= ENV.fetch("SEARCHOPS_PROCESS_ROLE", "web") %>-primary
  queue:
    <<: *default
    <% if ENV["QUEUE_DATABASE_URL"] %>
    url: <%= ENV.fetch("QUEUE_DATABASE_URL") %>
    <% else %>
    database: searchops_development_queue
    <% end %>
    max_connections: <%= Integer(ENV.fetch("SEARCHOPS_QUEUE_DATABASE_POOL", 5)) %>
    application_name: searchops-development-<%= ENV.fetch("SEARCHOPS_PROCESS_ROLE", "web") %>-queue
    migrations_paths: db/queue_migrate
  cache:
    <<: *default
    <% if ENV["CACHE_DATABASE_URL"] %>
    url: <%= ENV.fetch("CACHE_DATABASE_URL") %>
    <% else %>
    database: searchops_development_cache
    <% end %>
    max_connections: <%= Integer(ENV.fetch("SEARCHOPS_CACHE_DATABASE_POOL", 2)) %>
    application_name: searchops-development-<%= ENV.fetch("SEARCHOPS_PROCESS_ROLE", "web") %>-cache
    migrations_paths: db/cache_migrate
  cable:
    <<: *default
    <% if ENV["CABLE_DATABASE_URL"] %>
    url: <%= ENV.fetch("CABLE_DATABASE_URL") %>
    <% else %>
    database: searchops_development_cable
    <% end %>
    max_connections: <%= Integer(ENV.fetch("SEARCHOPS_CABLE_DATABASE_POOL", 2)) %>
    application_name: searchops-development-<%= ENV.fetch("SEARCHOPS_PROCESS_ROLE", "web") %>-cable
    migrations_paths: db/cable_migrate

